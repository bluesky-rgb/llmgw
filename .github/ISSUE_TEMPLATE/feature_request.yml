name: 功能请求 / Feature request
description: 提出新功能或改进 / Suggest a new feature or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看看 [路线图](https://github.com/bluesky-rgb/llmgw/blob/main/docs/roadmap.md)，也许已经在计划中。还不确定的想法，可以先在 [Discussions](https://github.com/bluesky-rgb/llmgw/discussions) 讨论。
        Check the roadmap first. For early-stage ideas, start a discussion.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你遇到了什么情况，现在的 llmgw 为什么不够用 / What are you trying to do, and why llmgw does not cover it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 / Proposed solution
      description: 配置或接口大概是什么样 / What the config or API could look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法 / Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与 / Contribution
      options:
        - label: 我愿意实现它（按 CONTRIBUTING.md 的流程）/ I am willing to implement this (following CONTRIBUTING.md).
          required: false
