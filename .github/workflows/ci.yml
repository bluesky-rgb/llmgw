name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 每周一检查一次依赖漏洞（没有提交时也能发现新公布的漏洞）
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name != 'schedule'
    name: build-test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            type: Release
            flags: ""
          - name: asan-ubsan
            type: Debug
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          - name: tsan
            type: Debug
            flags: "-fsanitize=thread"
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/dependencies.json') }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  architecture:
    if: github.event_name != 'schedule'
    name: architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev clang-format-18 clang-tidy-18
      # 每一项检查都会执行并报告，便于一次看到所有问题
      - name: Module dependency rules
        if: always()
        run: python3 tools/check_deps.py
      - name: TODO format
        if: always()
        run: python3 tools/check_todos.py
      - name: clang-format
        if: always()
        run: |
          files=$(find src tests/unit tests/integration tests/fuzz tests/common -name '*.cpp' -o -name '*.h' -o -name '*.hpp')
          if [ -n "$files" ]; then clang-format-18 --dry-run --Werror $files; fi
      - name: Cache third-party sources
        if: always()
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/dependencies.json') }}
      - name: Configure (for clang-tidy)
        if: always()
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-18
          -DLLMGW_BUILD_PROTOTYPE=OFF
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps
      - name: clang-tidy
        if: always()
        run: CLANG_TIDY=clang-tidy-18 tools/run_clang_tidy.sh build
      # 测试工具（Go）：格式、静态检查、单元测试（含竞态检测）
      - uses: actions/setup-go@v5
        if: always()
        with:
          go-version-file: tools/mock-upstream/go.mod
          cache: false
      - name: mock-upstream (gofmt / vet / test)
        if: always()
        working-directory: tools/mock-upstream
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "需要 gofmt 的文件：$unformatted"; exit 1; fi
          go vet ./...
          go test -race -count=1 ./...

  fuzz:
    # 每个模糊测试目标运行 60 秒（libFuzzer，覆盖率引导）。发现问题时把触发它的输入上传为构件
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev libssl-dev
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/dependencies.json') }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-18 -DLLMGW_BUILD_FUZZ=ON
          -DLLMGW_BUILD_TESTS=OFF -DLLMGW_BUILD_PROTOTYPE=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps
      - name: Build
        run: cmake --build build --target llmgw_fuzz_config llmgw_fuzz_syntax llmgw_fuzz_chat_fields llmgw_fuzz_upstream_response llmgw_fuzz_sse llmgw_fuzz_rewrite
      - name: Fuzz
        run: |
          set -e
          mkdir -p crashes
          for t in config:config syntax:syntax chat_fields:chat upstream_response:upstream sse:sse rewrite:rewrite; do
            name=${t%%:*}; corpus=${t##*:}
            echo "== $name"
            build/tests/fuzz/llmgw_fuzz_$name tests/fuzz/corpus/$corpus -max_total_time=60 -artifact_prefix=crashes/$name- -print_final_stats=1
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: crashes/

  # 新架构的镜像（任务 1.9）：能构建；默认因为没有鉴权而拒绝启动；显式确认后能启动、/health 可用
  docker:
    if: github.event_name != 'schedule'
    name: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t llmgw:ci .
      - name: Refuses to start without authentication
        run: |
          set +e
          out=$(docker run --rm -e OPENAI_API_KEY=x -e MINIMAX_API_KEY=x -e MIMO_API_KEY=x llmgw:ci 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" = 1
          echo "$out" | grep -q -- "--allow-unauthenticated"
      - name: Starts with --allow-unauthenticated
        run: |
          docker run -d --name gw -p 127.0.0.1:9100:9100 \
            -e OPENAI_API_KEY=x -e MINIMAX_API_KEY=x -e MIMO_API_KEY=x \
            llmgw:ci serve -c /etc/llmgw/llmgw.json --allow-unauthenticated
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9100/health && break; sleep 1; done
          curl -sf http://127.0.0.1:9100/health || { docker logs gw; exit 1; }
          docker logs gw
          docker stop gw

  # DCO：来自 fork 的 PR，每个提交都要有 Signed-off-by（见 CONTRIBUTING.md；维护者的提交不检查的原因也写在那里）
  dco:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    name: dco
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_dco.py "$BASE" "$HEAD"

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check third-party dependencies against OSV
        run: python3 tools/check_vulns.py
