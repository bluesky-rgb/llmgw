<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img"><title>代码模块分层与依赖方向</title><desc>从上到下七层：app 包含 main；接入层包含 server 和 admin；编排层包含 middleware 和 executor；业务层包含 router 和 provider；上游层包含 upstream、stream 和 accounting；基础层包含 config 和 observability；最底层是 core，即公共类型与接口。每个模块是一个独立的 CMake 目标，只能依赖下面层的模块，依赖规则由脚本在 CI 中检查。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="20" width="560" height="50" rx="8" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="60" y="45" dominant-baseline="central">应用</text>
<g class="c-gray"><rect x="170" y="28" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="230" y="45" text-anchor="middle" dominant-baseline="central">main</text></g>
<rect x="40" y="80" width="560" height="50" rx="8" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="60" y="105" dominant-baseline="central">接入层</text>
<g class="c-purple"><rect x="170" y="88" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="230" y="105" text-anchor="middle" dominant-baseline="central">server</text></g>
<g class="c-purple"><rect x="305" y="88" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="365" y="105" text-anchor="middle" dominant-baseline="central">admin</text></g>
<rect x="40" y="140" width="560" height="50" rx="8" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="60" y="165" dominant-baseline="central">编排层</text>
<g class="c-teal"><rect x="170" y="148" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="230" y="165" text-anchor="middle" dominant-baseline="central">middleware</text></g>
<g class="c-teal"><rect x="305" y="148" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="365" y="165" text-anchor="middle" dominant-baseline="central">executor</text></g>
<rect x="40" y="200" width="560" height="50" rx="8" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="60" y="225" dominant-baseline="central">业务层</text>
<g class="c-teal"><rect x="170" y="208" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="230" y="225" text-anchor="middle" dominant-baseline="central">router</text></g>
<g class="c-teal"><rect x="305" y="208" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="365" y="225" text-anchor="middle" dominant-baseline="central">provider</text></g>
<rect x="40" y="260" width="560" height="50" rx="8" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="60" y="285" dominant-baseline="central">上游层</text>
<g class="c-teal"><rect x="170" y="268" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="230" y="285" text-anchor="middle" dominant-baseline="central">upstream</text></g>
<g class="c-teal"><rect x="305" y="268" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="365" y="285" text-anchor="middle" dominant-baseline="central">stream</text></g>
<g class="c-teal"><rect x="440" y="268" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="500" y="285" text-anchor="middle" dominant-baseline="central">accounting</text></g>
<rect x="40" y="320" width="560" height="50" rx="8" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="60" y="345" dominant-baseline="central">基础层</text>
<g class="c-amber"><rect x="170" y="328" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="230" y="345" text-anchor="middle" dominant-baseline="central">config</text></g>
<g class="c-amber"><rect x="305" y="328" width="120" height="34" rx="6" stroke-width="0.5"/><text class="t" x="365" y="345" text-anchor="middle" dominant-baseline="central">observability</text></g>
<rect x="40" y="380" width="560" height="50" rx="8" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="60" y="405" dominant-baseline="central">core</text>
<g class="c-amber"><rect x="170" y="388" width="390" height="34" rx="6" stroke-width="0.5"/><text class="t" x="365" y="405" text-anchor="middle" dominant-baseline="central">公共类型与接口（不依赖任何模块）</text></g>
<line x1="622" y1="24" x2="622" y2="426" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="456" text-anchor="middle" dominant-baseline="central">每个模块是独立的 CMake 目标；只能依赖下面的层，由 CI 自动检查</text>
</svg>
