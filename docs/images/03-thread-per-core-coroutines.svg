<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img"><title>分区负责加协程的整体结构</title><desc>内核通过 SO_REUSEPORT 把新连接分给三个线程。每个线程有一个 io_context 事件循环，里面跑着很多协程，每条连接一个协程；每个线程有独享的连接池、熔断和计数数据。需要全局数据时再汇总。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="20" width="600" height="44" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">内核 SO_REUSEPORT：把新连接分给各个线程</text>
<line x1="130" y1="64" x2="130" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="64" x2="340" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="64" x2="550" y2="88" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="90" width="180" height="210" rx="10" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="130" y="112" text-anchor="middle" dominant-baseline="central">线程 1</text>
<text class="ts" x="130" y="132" text-anchor="middle" dominant-baseline="central">一个 io_context</text>
<circle cx="70" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="100" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="130" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="160" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="190" cy="165" r="11" class="c-purple" stroke-width="0.5"/>
<text class="ts" x="130" y="196" text-anchor="middle" dominant-baseline="central">每连接一个协程</text>
<g class="c-teal"><rect x="50" y="220" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="238" text-anchor="middle" dominant-baseline="central">独享数据</text><text class="ts" x="130" y="258" text-anchor="middle" dominant-baseline="central">连接池 熔断 计数</text></g>
<rect x="250" y="90" width="180" height="210" rx="10" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="340" y="112" text-anchor="middle" dominant-baseline="central">线程 2</text>
<text class="ts" x="340" y="132" text-anchor="middle" dominant-baseline="central">一个 io_context</text>
<circle cx="280" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="310" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="340" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="370" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="400" cy="165" r="11" class="c-purple" stroke-width="0.5"/>
<text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central">每连接一个协程</text>
<g class="c-teal"><rect x="260" y="220" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">独享数据</text><text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">连接池 熔断 计数</text></g>
<rect x="460" y="90" width="180" height="210" rx="10" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="550" y="112" text-anchor="middle" dominant-baseline="central">线程 N（= CPU 核数）</text>
<text class="ts" x="550" y="132" text-anchor="middle" dominant-baseline="central">一个 io_context</text>
<circle cx="490" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="520" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="550" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="580" cy="165" r="11" class="c-purple" stroke-width="0.5"/><circle cx="610" cy="165" r="11" class="c-purple" stroke-width="0.5"/>
<text class="ts" x="550" y="196" text-anchor="middle" dominant-baseline="central">每连接一个协程</text>
<g class="c-teal"><rect x="470" y="220" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="238" text-anchor="middle" dominant-baseline="central">独享数据</text><text class="ts" x="550" y="258" text-anchor="middle" dominant-baseline="central">连接池 熔断 计数</text></g>
<line x1="130" y1="300" x2="130" y2="324" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="300" x2="340" y2="324" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="300" x2="550" y2="324" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="326" width="600" height="44" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="340" y="348" text-anchor="middle" dominant-baseline="central">少量全局数据：配置快照、预算、/metrics 汇总</text>
<circle cx="46" cy="392" r="6" class="c-purple" stroke-width="0.5"/><text class="ts" x="58" y="396">协程</text>
<rect x="100" y="386" width="12" height="12" rx="2" class="c-teal" stroke-width="0.5"/><text class="ts" x="118" y="396">线程独享，不加锁</text>
</svg>
