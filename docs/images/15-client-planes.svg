<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img"><title>客户端如何与网关交互：三个平面</title><desc>左侧四类使用者：业务应用通过 OpenAI SDK、框架与工具如 LangChain、Dify、IDE，都访问数据面 8080 端口，包括 chat completions、models 和 usage 接口；管理员通过 llmgw 命令行访问管理面 9090 端口，只在内网开放；监控系统和探针访问观测面 9100 端口的 metrics、health、ready。数据面再把请求转发到上游模型 GPT、MiniMax、MiMo。三个端口分开，业务流量、管理操作和监控抓取互不影响。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="170" height="56" rx="8" class="box" stroke-width="0.5"/><text class="th" x="125" y="58" text-anchor="middle" dominant-baseline="central">业务应用</text><text class="ts" x="125" y="78" text-anchor="middle" dominant-baseline="central">OpenAI SDK</text>
<rect x="40" y="120" width="170" height="56" rx="8" class="box" stroke-width="0.5"/><text class="th" x="125" y="138" text-anchor="middle" dominant-baseline="central">框架与工具</text><text class="ts" x="125" y="158" text-anchor="middle" dominant-baseline="central">LangChain Dify IDE</text>
<rect x="40" y="200" width="170" height="56" rx="8" class="box" stroke-width="0.5"/><text class="th" x="125" y="218" text-anchor="middle" dominant-baseline="central">管理员</text><text class="ts" x="125" y="238" text-anchor="middle" dominant-baseline="central">llmgw 命令行</text>
<rect x="40" y="280" width="170" height="56" rx="8" class="box" stroke-width="0.5"/><text class="th" x="125" y="298" text-anchor="middle" dominant-baseline="central">监控系统</text><text class="ts" x="125" y="318" text-anchor="middle" dominant-baseline="central">Prometheus 与探针</text>
<rect x="250" y="20" width="250" height="330" rx="12" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="375" y="38" text-anchor="middle" dominant-baseline="central">llmgw</text>
<g class="c-teal"><rect x="265" y="52" width="220" height="110" rx="8" stroke-width="0.5"/><text class="th" x="375" y="72" text-anchor="middle" dominant-baseline="central">数据面 :8080</text><text class="ts" x="375" y="96" text-anchor="middle" dominant-baseline="central">/v1/chat/completions</text><text class="ts" x="375" y="116" text-anchor="middle" dominant-baseline="central">/v1/models</text><text class="ts" x="375" y="136" text-anchor="middle" dominant-baseline="central">/v1/llmgw/usage</text></g>
<g class="c-purple"><rect x="265" y="190" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="375" y="208" text-anchor="middle" dominant-baseline="central">管理面 :9090</text><text class="ts" x="375" y="228" text-anchor="middle" dominant-baseline="central">/admin/*，只在内网开放</text></g>
<g class="c-gray"><rect x="265" y="270" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="375" y="288" text-anchor="middle" dominant-baseline="central">观测面 :9100</text><text class="ts" x="375" y="308" text-anchor="middle" dominant-baseline="central">/metrics /health /ready</text></g>
<line x1="210" y1="68" x2="263" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="148" x2="263" y2="132" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="228" x2="263" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="308" x2="263" y2="298" class="arr" marker-end="url(#arrow)"/>
<rect x="530" y="80" width="110" height="56" rx="8" class="box" stroke-width="0.5"/><text class="th" x="585" y="98" text-anchor="middle" dominant-baseline="central">上游模型</text><text class="ts" x="585" y="118" text-anchor="middle" dominant-baseline="central">GPT MiniMax MiMo</text>
<line x1="485" y1="107" x2="528" y2="107" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="378" text-anchor="middle" dominant-baseline="central">三个端口分开：业务流量、管理操作、监控抓取互不影响；管理面不暴露到公网</text>
</svg>
