<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img"><title>模块调用方式与数据流</title><desc>时序图。Session 依次用 co_await 调用 middleware 的 on_request 得到 Decision，调用 router 的 resolve 得到目标列表，调用 executor 的 execute。executor 通过 upstream 发送请求，拿到响应头和响应体，交给 stream 包装成 ResponseStream 返回给 Session。随后 Session 循环调用 next 拉取数据块，stream 从 upstream 读取字节并返回 Chunk，Session 写给客户端后再拉下一块。最后 Session 调用 middleware 的 on_complete 结算。所有调用都从上层指向下层，数据作为返回值向上流动。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="38" y="20" width="84" height="36" rx="6" stroke-width="0.5"/><text class="th" x="80" y="38" text-anchor="middle" dominant-baseline="central">Session</text></g>
<g class="c-teal"><rect x="148" y="20" width="84" height="36" rx="6" stroke-width="0.5"/><text class="t" x="190" y="38" text-anchor="middle" dominant-baseline="central">middleware</text></g>
<g class="c-teal"><rect x="258" y="20" width="84" height="36" rx="6" stroke-width="0.5"/><text class="t" x="300" y="38" text-anchor="middle" dominant-baseline="central">router</text></g>
<g class="c-teal"><rect x="368" y="20" width="84" height="36" rx="6" stroke-width="0.5"/><text class="t" x="410" y="38" text-anchor="middle" dominant-baseline="central">executor</text></g>
<g class="c-teal"><rect x="478" y="20" width="84" height="36" rx="6" stroke-width="0.5"/><text class="t" x="520" y="38" text-anchor="middle" dominant-baseline="central">upstream</text></g>
<g class="c-teal"><rect x="578" y="20" width="84" height="36" rx="6" stroke-width="0.5"/><text class="t" x="620" y="38" text-anchor="middle" dominant-baseline="central">stream</text></g>
<line x1="80" y1="56" x2="80" y2="580" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="190" y1="56" x2="190" y2="580" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="300" y1="56" x2="300" y2="580" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="410" y1="56" x2="410" y2="580" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="520" y1="56" x2="520" y2="580" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="620" y1="56" x2="620" y2="580" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="135" y="84" text-anchor="middle">on_request(ctx)</text>
<line x1="80" y1="92" x2="188" y2="92" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="135" y="112" text-anchor="middle">Decision</text>
<line x1="190" y1="120" x2="82" y2="120" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="190" y="150" text-anchor="middle">resolve(model)</text>
<line x1="80" y1="158" x2="298" y2="158" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="190" y="178" text-anchor="middle">vector&lt;Target&gt;</text>
<line x1="300" y1="186" x2="82" y2="186" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="245" y="216" text-anchor="middle">execute(ctx, targets)</text>
<line x1="80" y1="224" x2="408" y2="224" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="465" y="246" text-anchor="middle">send(req)</text>
<line x1="410" y1="254" x2="518" y2="254" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="465" y="274" text-anchor="middle">head + body</text>
<line x1="520" y1="282" x2="412" y2="282" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="515" y="304" text-anchor="middle">wrap(body)</text>
<line x1="410" y1="312" x2="618" y2="312" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="515" y="332" text-anchor="middle">ResponseStream</text>
<line x1="620" y1="340" x2="412" y2="340" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="245" y="360" text-anchor="middle">ResponseStream</text>
<line x1="410" y1="368" x2="82" y2="368" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="40" y="384" width="622" height="132" rx="8" fill="none" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5 3"/>
<text class="ts" x="50" y="400">循环：写完一块再拉下一块（背压）</text>
<text class="ts" x="350" y="420" text-anchor="middle">co_await next()</text>
<line x1="80" y1="428" x2="618" y2="428" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="570" y="448" text-anchor="middle">read()</text>
<line x1="620" y1="456" x2="522" y2="456" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="570" y="474" text-anchor="middle">bytes</text>
<line x1="520" y1="482" x2="618" y2="482" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="496" text-anchor="middle">Chunk（Session 写给客户端）</text>
<line x1="620" y1="504" x2="82" y2="504" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="135" y="546" text-anchor="middle">on_complete(ctx, outcome)</text>
<line x1="80" y1="554" x2="188" y2="554" class="arr" marker-end="url(#arrow)"/>
<line x1="40" y1="608" x2="80" y2="608" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="90" y="612">调用（co_await，向下）</text>
<line x1="260" y1="608" x2="300" y2="608" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="310" y="612">返回数据（向上）</text>
</svg>
