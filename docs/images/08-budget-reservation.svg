<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img"><title>预算预留：现在与方案对比</title><desc>左列：100 个请求同时到达，各自查余额都看到剩 1 美元，全部放行，结果超支。右列：查余额和冻结一步完成，余额够就冻结并放行，不够就拒绝，请求结束后按实际用量结算。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="170" y="26" text-anchor="middle">没有预留</text>
<text class="th" x="500" y="26" text-anchor="middle">方案：先冻结，后结算</text>
<g class="c-gray"><rect x="40" y="44" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="62" text-anchor="middle" dominant-baseline="central">100 个请求同时到达</text><text class="ts" x="170" y="82" text-anchor="middle" dominant-baseline="central">余额只剩 $1</text></g>
<line x1="170" y1="100" x2="170" y2="132" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="134" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="152" text-anchor="middle" dominant-baseline="central">各自查余额</text><text class="ts" x="170" y="172" text-anchor="middle" dominant-baseline="central">每个都看到还剩 $1</text></g>
<line x1="170" y1="190" x2="170" y2="222" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="40" y="224" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="242" text-anchor="middle" dominant-baseline="central">全部放行</text><text class="ts" x="170" y="262" text-anchor="middle" dominant-baseline="central">谁都没先扣钱</text></g>
<line x1="170" y1="280" x2="170" y2="312" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="40" y="314" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="332" text-anchor="middle" dominant-baseline="central">超支几十倍</text><text class="ts" x="170" y="352" text-anchor="middle" dominant-baseline="central">花掉 $30 以上</text></g>
<g class="c-gray"><rect x="370" y="44" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="62" text-anchor="middle" dominant-baseline="central">100 个请求同时到达</text><text class="ts" x="505" y="82" text-anchor="middle" dominant-baseline="central">余额只剩 $1</text></g>
<line x1="505" y1="100" x2="505" y2="132" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="370" y="134" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="152" text-anchor="middle" dominant-baseline="central">查余额 + 冻结，一步完成</text><text class="ts" x="505" y="172" text-anchor="middle" dominant-baseline="central">不可分割，逐个通过</text></g>
<path d="M440 190 L440 222" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M575 190 L575 222" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="370" y="224" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="435" y="242" text-anchor="middle" dominant-baseline="central">冻结，放行</text><text class="ts" x="435" y="262" text-anchor="middle" dominant-baseline="central">余额足够</text></g>
<g class="c-gray"><rect x="510" y="224" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="575" y="242" text-anchor="middle" dominant-baseline="central">直接拒绝</text><text class="ts" x="575" y="262" text-anchor="middle" dominant-baseline="central">余额不够</text></g>
<line x1="435" y1="280" x2="435" y2="312" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="370" y="314" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="332" text-anchor="middle" dominant-baseline="central">请求结束后结算</text><text class="ts" x="505" y="352" text-anchor="middle" dominant-baseline="central">按实际用量，多退少补</text></g>
</svg>
