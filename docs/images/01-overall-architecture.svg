<svg xmlns="http://www.w3.org/2000/svg" width="680" height="665" viewBox="0 0 680 665" role="img"><title>llmgw 整体架构</title><desc>客户端的连接由内核分给各个线程。线程 1 展开显示：每条连接一个协程，协程内依次经过中间件、路由、执行、协议适配、流式转发；线程独享连接池、熔断状态、指标计数；连接池连到上游模型。其余线程结构相同。底部是少量跨线程的全局数据：配置快照、预算账本、指标汇总，分别对接管理员和 Prometheus。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="665" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="160" y="20" width="200" height="44" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="260" y="42" text-anchor="middle" dominant-baseline="central">客户端（你的应用）</text>
<line x1="260" y1="64" x2="260" y2="88" class="arr" marker-end="url(#arrow)"/>
<rect x="30" y="90" width="475" height="40" rx="8" class="box" stroke-width="0.5"/>
<text class="t" x="267" y="110" text-anchor="middle" dominant-baseline="central">内核 SO_REUSEPORT：新连接分给各线程</text>
<rect x="30" y="150" width="475" height="400" rx="14" fill="none" stroke="#b4b2a9" stroke-width="0.5"/>
<text class="th" x="44" y="168" dominant-baseline="central">llmgw 进程</text>
<line x1="200" y1="130" x2="200" y2="183" class="arr" marker-end="url(#arrow)"/>
<line x1="440" y1="130" x2="440" y2="298" class="arr" marker-end="url(#arrow)"/>
<rect x="45" y="185" width="330" height="270" rx="10" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="210" y="203" text-anchor="middle" dominant-baseline="central">线程 1（一个 io_context）</text>
<g class="c-purple"><rect x="55" y="220" width="190" height="225" rx="8" stroke-width="0.5"/><text class="th" x="150" y="238" text-anchor="middle" dominant-baseline="central">协程：一条连接一个</text></g>
<rect x="67" y="252" width="166" height="30" rx="4" class="box" stroke-width="0.5"/><text class="t" x="150" y="267" text-anchor="middle" dominant-baseline="central">1 鉴权 限流 预算</text>
<rect x="67" y="290" width="166" height="30" rx="4" class="box" stroke-width="0.5"/><text class="t" x="150" y="305" text-anchor="middle" dominant-baseline="central">2 路由：模型→目标</text>
<rect x="67" y="328" width="166" height="30" rx="4" class="box" stroke-width="0.5"/><text class="t" x="150" y="343" text-anchor="middle" dominant-baseline="central">3 执行：重试 熔断</text>
<rect x="67" y="366" width="166" height="30" rx="4" class="box" stroke-width="0.5"/><text class="t" x="150" y="381" text-anchor="middle" dominant-baseline="central">4 协议适配</text>
<rect x="67" y="404" width="166" height="30" rx="4" class="box" stroke-width="0.5"/><text class="t" x="150" y="419" text-anchor="middle" dominant-baseline="central">5 流式转发（背压）</text>
<text class="ts" x="312" y="238" text-anchor="middle" dominant-baseline="central">本线程独享</text>
<g class="c-teal"><rect x="260" y="252" width="105" height="40" rx="6" stroke-width="0.5"/><text class="th" x="312" y="272" text-anchor="middle" dominant-baseline="central">连接池</text></g>
<g class="c-teal"><rect x="260" y="304" width="105" height="40" rx="6" stroke-width="0.5"/><text class="th" x="312" y="324" text-anchor="middle" dominant-baseline="central">熔断状态</text></g>
<g class="c-teal"><rect x="260" y="356" width="105" height="40" rx="6" stroke-width="0.5"/><text class="th" x="312" y="376" text-anchor="middle" dominant-baseline="central">指标计数</text></g>
<rect x="390" y="300" width="100" height="155" rx="10" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="440" y="350" text-anchor="middle" dominant-baseline="central">线程 2…N</text>
<text class="ts" x="440" y="374" text-anchor="middle" dominant-baseline="central">结构相同</text>
<text class="ts" x="440" y="394" text-anchor="middle" dominant-baseline="central">每核一个</text>
<text class="ts" x="587" y="185" text-anchor="middle" dominant-baseline="central">上游模型</text>
<rect x="525" y="200" width="125" height="44" rx="8" class="box" stroke-width="0.5"/><text class="th" x="587" y="222" text-anchor="middle" dominant-baseline="central">OpenAI</text>
<rect x="525" y="256" width="125" height="44" rx="8" class="box" stroke-width="0.5"/><text class="th" x="587" y="278" text-anchor="middle" dominant-baseline="central">MiniMax</text>
<rect x="525" y="312" width="125" height="44" rx="8" class="box" stroke-width="0.5"/><text class="th" x="587" y="334" text-anchor="middle" dominant-baseline="central">小米 MiMo</text>
<line x1="365" y1="278" x2="523" y2="278" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="45" y="470" dominant-baseline="central">全局共享：少量，跨线程</text>
<g class="c-amber"><rect x="45" y="482" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="115" y="500" text-anchor="middle" dominant-baseline="central">配置快照</text><text class="ts" x="115" y="520" text-anchor="middle" dominant-baseline="central">整体原子替换</text></g>
<g class="c-amber"><rect x="195" y="482" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="265" y="500" text-anchor="middle" dominant-baseline="central">预算账本</text><text class="ts" x="265" y="520" text-anchor="middle" dominant-baseline="central">先冻结后结算</text></g>
<g class="c-amber"><rect x="345" y="482" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="415" y="500" text-anchor="middle" dominant-baseline="central">指标汇总</text><text class="ts" x="415" y="520" text-anchor="middle" dominant-baseline="central">访问时收集</text></g>
<rect x="45" y="575" width="140" height="44" rx="8" class="box" stroke-width="0.5"/><text class="th" x="115" y="597" text-anchor="middle" dominant-baseline="central">管理员改配置</text>
<line x1="115" y1="575" x2="115" y2="540" class="arr" marker-end="url(#arrow)"/>
<rect x="345" y="575" width="140" height="44" rx="8" class="box" stroke-width="0.5"/><text class="th" x="415" y="597" text-anchor="middle" dominant-baseline="central">Prometheus</text>
<line x1="415" y1="575" x2="415" y2="540" class="arr" marker-end="url(#arrow)"/>
<rect x="45" y="638" width="12" height="12" rx="2" class="c-purple" stroke-width="0.5"/><text class="ts" x="63" y="648">协程</text>
<rect x="115" y="638" width="12" height="12" rx="2" class="c-teal" stroke-width="0.5"/><text class="ts" x="133" y="648">线程独享，不加锁</text>
<rect x="265" y="638" width="12" height="12" rx="2" class="c-amber" stroke-width="0.5"/><text class="ts" x="283" y="648">全局共享，需小心并发</text>
</svg>
