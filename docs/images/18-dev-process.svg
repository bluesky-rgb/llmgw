<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img"><title>每个任务的开发流程</title><desc>每个任务都经过六步：一，任务设计；二，设计评审，作者确认通过才能开工，不通过就修改设计；三，实现；四，验证，包括自动检查和验证记录；五，合并；六，复盘，然后进入下一个任务。下方是三层设计文档：总体设计细化为模块设计，再细化为任务设计。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M340 40 L340 22 L125 22 L125 38" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="232" y="12" text-anchor="middle" dominant-baseline="central">不通过：修改设计</text>
<g class="c-teal"><rect x="40" y="40" width="170" height="64" rx="8" stroke-width="0.5"/><text class="th" x="125" y="62" text-anchor="middle" dominant-baseline="central">① 任务设计</text><text class="ts" x="125" y="84" text-anchor="middle" dominant-baseline="central">接口 流程 验证计划</text></g>
<g class="c-purple"><rect x="255" y="40" width="170" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">② 设计评审</text><text class="ts" x="340" y="84" text-anchor="middle" dominant-baseline="central">你确认通过才开工</text></g>
<g class="c-teal"><rect x="470" y="40" width="170" height="64" rx="8" stroke-width="0.5"/><text class="th" x="555" y="62" text-anchor="middle" dominant-baseline="central">③ 实现</text><text class="ts" x="555" y="84" text-anchor="middle" dominant-baseline="central">小步提交 先写测试</text></g>
<g class="c-purple"><rect x="470" y="160" width="170" height="64" rx="8" stroke-width="0.5"/><text class="th" x="555" y="182" text-anchor="middle" dominant-baseline="central">④ 验证</text><text class="ts" x="555" y="204" text-anchor="middle" dominant-baseline="central">自动检查 + 验证记录</text></g>
<g class="c-teal"><rect x="255" y="160" width="170" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="182" text-anchor="middle" dominant-baseline="central">⑤ 合并</text><text class="ts" x="340" y="204" text-anchor="middle" dominant-baseline="central">你能讲清每一行</text></g>
<g class="c-teal"><rect x="40" y="160" width="170" height="64" rx="8" stroke-width="0.5"/><text class="th" x="125" y="182" text-anchor="middle" dominant-baseline="central">⑥ 复盘</text><text class="ts" x="125" y="204" text-anchor="middle" dominant-baseline="central">更新文档 记录收获</text></g>
<line x1="210" y1="72" x2="253" y2="72" class="arr" marker-end="url(#arrow)"/>
<line x1="425" y1="72" x2="468" y2="72" class="arr" marker-end="url(#arrow)"/>
<line x1="555" y1="104" x2="555" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="470" y1="192" x2="427" y2="192" class="arr" marker-end="url(#arrow)"/>
<line x1="255" y1="192" x2="212" y2="192" class="arr" marker-end="url(#arrow)"/>
<path d="M125 160 L125 106" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="170" y="133" text-anchor="middle" dominant-baseline="central">下一个任务</text>
<text class="ts" x="40" y="258" dominant-baseline="central">三层设计文档：越往右越具体，必须和左边保持一致</text>
<g class="c-gray"><rect x="40" y="274" width="170" height="64" rx="8" stroke-width="0.5"/><text class="th" x="125" y="296" text-anchor="middle" dominant-baseline="central">总体设计</text><text class="ts" x="125" y="318" text-anchor="middle" dominant-baseline="central">design.md 等</text></g>
<g class="c-gray"><rect x="255" y="274" width="170" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="296" text-anchor="middle" dominant-baseline="central">模块设计</text><text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">模块 README 公开头文件</text></g>
<g class="c-gray"><rect x="470" y="274" width="170" height="64" rx="8" stroke-width="0.5"/><text class="th" x="555" y="296" text-anchor="middle" dominant-baseline="central">任务设计</text><text class="ts" x="555" y="318" text-anchor="middle" dominant-baseline="central">docs/tasks/</text></g>
<line x1="210" y1="306" x2="253" y2="306" class="arr" marker-end="url(#arrow)"/>
<line x1="425" y1="306" x2="468" y2="306" class="arr" marker-end="url(#arrow)"/>
</svg>
