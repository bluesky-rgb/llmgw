<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img"><title>监控、日志与统计的数据链路</title><desc>左侧是每个 Worker 的热路径，只做内存操作、不加锁：指标分片记录计数器和直方图，日志缓冲区是有界队列，满了就丢弃，用量聚合按 key、模型、天累计。中间是后台汇总：访问 metrics 时汇总指标，日志线程异步批量写出，用量每分钟合并落盘。右侧是外部系统：Prometheus 用于看板和告警，日志系统如 Loki 或 ELK，用量报表通过 Admin API 或 CSV 导出。底部说明 request_id 贯穿访问日志、每次尝试、上游请求头和错误响应。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="155" y="26" text-anchor="middle" dominant-baseline="central">热路径（每个 Worker，不加锁）</text>
<text class="ts" x="405" y="26" text-anchor="middle" dominant-baseline="central">后台汇总</text>
<text class="ts" x="580" y="26" text-anchor="middle" dominant-baseline="central">外部系统</text>
<rect x="40" y="44" width="230" height="250" rx="10" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<g class="c-teal"><rect x="60" y="64" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="155" y="82" text-anchor="middle" dominant-baseline="central">指标分片</text><text class="ts" x="155" y="102" text-anchor="middle" dominant-baseline="central">计数器 直方图</text></g>
<g class="c-teal"><rect x="60" y="144" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="155" y="162" text-anchor="middle" dominant-baseline="central">日志缓冲区</text><text class="ts" x="155" y="182" text-anchor="middle" dominant-baseline="central">有界队列，满了丢弃</text></g>
<g class="c-teal"><rect x="60" y="224" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="155" y="242" text-anchor="middle" dominant-baseline="central">用量聚合</text><text class="ts" x="155" y="262" text-anchor="middle" dominant-baseline="central">按 key 模型 天累计</text></g>
<line x1="250" y1="92" x2="318" y2="92" class="arr" marker-end="url(#arrow)"/>
<line x1="250" y1="172" x2="318" y2="172" class="arr" marker-end="url(#arrow)"/>
<line x1="250" y1="252" x2="318" y2="252" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="320" y="64" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="405" y="82" text-anchor="middle" dominant-baseline="central">抓取时汇总</text><text class="ts" x="405" y="102" text-anchor="middle" dominant-baseline="central">访问 /metrics 时</text></g>
<g class="c-gray"><rect x="320" y="144" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="405" y="162" text-anchor="middle" dominant-baseline="central">日志线程</text><text class="ts" x="405" y="182" text-anchor="middle" dominant-baseline="central">异步批量写出</text></g>
<g class="c-gray"><rect x="320" y="224" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="405" y="242" text-anchor="middle" dominant-baseline="central">定时合并落盘</text><text class="ts" x="405" y="262" text-anchor="middle" dominant-baseline="central">每分钟一次</text></g>
<line x1="490" y1="92" x2="518" y2="92" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="172" x2="518" y2="172" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="252" x2="518" y2="252" class="arr" marker-end="url(#arrow)"/>
<rect x="520" y="64" width="120" height="56" rx="8" class="box" stroke-width="0.5"/><text class="th" x="580" y="82" text-anchor="middle" dominant-baseline="central">Prometheus</text><text class="ts" x="580" y="102" text-anchor="middle" dominant-baseline="central">看板 告警</text>
<rect x="520" y="144" width="120" height="56" rx="8" class="box" stroke-width="0.5"/><text class="th" x="580" y="162" text-anchor="middle" dominant-baseline="central">日志系统</text><text class="ts" x="580" y="182" text-anchor="middle" dominant-baseline="central">Loki ELK</text>
<rect x="520" y="224" width="120" height="56" rx="8" class="box" stroke-width="0.5"/><text class="th" x="580" y="242" text-anchor="middle" dominant-baseline="central">用量报表</text><text class="ts" x="580" y="262" text-anchor="middle" dominant-baseline="central">Admin API CSV</text>
<g class="c-purple"><rect x="40" y="318" width="600" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central">request_id 贯穿全程</text><text class="ts" x="340" y="356" text-anchor="middle" dominant-baseline="central">访问日志 · 每次尝试 · 上游请求头 · 错误响应</text></g>
</svg>
