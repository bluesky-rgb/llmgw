<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>并发层的对象设计</title><desc>Gateway 拥有 N 个 Worker 和全局对象。每个 Worker 拥有 io_context、Acceptor、UpstreamPool、熔断器表和指标分片，并为每条连接创建一个 Session 协程。Session 内运行请求处理流水线。全局对象包括 ConfigStore、BudgetLedger 和 BlockingPool。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="240" y="20" width="200" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Gateway</text>
<text class="ts" x="340" y="58" text-anchor="middle" dominant-baseline="central">启动、停止、持有一切</text>
<path d="M300 76 L300 96 L180 96 L180 116" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M380 76 L380 96 L530 96 L530 116" fill="none" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="118" width="400" height="300" rx="12" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="60" y="140" dominant-baseline="central">Worker × N（每核一个线程）</text>
<g class="c-teal"><rect x="60" y="158" width="170" height="44" rx="6" stroke-width="0.5"/><text class="th" x="145" y="180" text-anchor="middle" dominant-baseline="central">io_context</text></g>
<g class="c-teal"><rect x="250" y="158" width="170" height="44" rx="6" stroke-width="0.5"/><text class="th" x="335" y="180" text-anchor="middle" dominant-baseline="central">Acceptor</text></g>
<g class="c-teal"><rect x="60" y="214" width="170" height="44" rx="6" stroke-width="0.5"/><text class="th" x="145" y="236" text-anchor="middle" dominant-baseline="central">UpstreamPool</text></g>
<g class="c-teal"><rect x="250" y="214" width="170" height="44" rx="6" stroke-width="0.5"/><text class="th" x="335" y="236" text-anchor="middle" dominant-baseline="central">熔断器表</text></g>
<g class="c-teal"><rect x="60" y="270" width="170" height="44" rx="6" stroke-width="0.5"/><text class="th" x="145" y="292" text-anchor="middle" dominant-baseline="central">指标分片</text></g>
<g class="c-teal"><rect x="250" y="270" width="170" height="44" rx="6" stroke-width="0.5"/><text class="th" x="335" y="292" text-anchor="middle" dominant-baseline="central">Session 列表</text></g>
<line x1="335" y1="314" x2="335" y2="340" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="342" width="360" height="56" rx="8" stroke-width="0.5"/><text class="th" x="240" y="360" text-anchor="middle" dominant-baseline="central">Session 协程（每条连接一个）</text><text class="ts" x="240" y="380" text-anchor="middle" dominant-baseline="central">中间件 → 路由 → 执行 → 适配 → 转发</text></g>
<rect x="460" y="118" width="180" height="300" rx="12" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="550" y="140" text-anchor="middle" dominant-baseline="central">全局对象（各一个）</text>
<g class="c-amber"><rect x="475" y="158" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="550" y="176" text-anchor="middle" dominant-baseline="central">ConfigStore</text><text class="ts" x="550" y="196" text-anchor="middle" dominant-baseline="central">配置快照</text></g>
<g class="c-amber"><rect x="475" y="228" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="550" y="246" text-anchor="middle" dominant-baseline="central">BudgetLedger</text><text class="ts" x="550" y="266" text-anchor="middle" dominant-baseline="central">预算账本</text></g>
<g class="c-amber"><rect x="475" y="298" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="550" y="316" text-anchor="middle" dominant-baseline="central">BlockingPool</text><text class="ts" x="550" y="336" text-anchor="middle" dominant-baseline="central">DNS、大 JSON</text></g>
<path d="M420 370 L448 370 L448 256 L473 256" fill="none" stroke="#b4b2a9" stroke-width="0.8" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<path d="M448 370 L448 326 L473 326" fill="none" stroke="#b4b2a9" stroke-width="0.8" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<path d="M448 256 L448 186 L473 186" fill="none" stroke="#b4b2a9" stroke-width="0.8" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<rect x="40" y="440" width="12" height="12" rx="2" class="c-teal" stroke-width="0.5"/><text class="ts" x="58" y="450">每个 Worker 一份，不加锁</text>
<rect x="250" y="440" width="12" height="12" rx="2" class="c-purple" stroke-width="0.5"/><text class="ts" x="268" y="450">协程</text>
<rect x="330" y="440" width="12" height="12" rx="2" class="c-amber" stroke-width="0.5"/><text class="ts" x="348" y="450">全局，需要线程安全</text>
<line x1="40" y1="478" x2="70" y2="478" stroke="#b4b2a9" stroke-width="0.8" stroke-dasharray="3 3"/><text class="ts" x="78" y="482">Session 少量访问全局对象</text>
</svg>
