<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>网关上的两种连接</title><desc>左边是客户端到网关的入站连接，由线程和协程处理。右边是网关到上游模型的出站连接，由每个线程独享的连接池管理和复用。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="70" width="120" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="100" y="88" text-anchor="middle" dominant-baseline="central">客户端</text>
<text class="ts" x="100" y="108" text-anchor="middle" dominant-baseline="central">你的应用</text>
<rect x="40" y="170" width="120" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="100" y="188" text-anchor="middle" dominant-baseline="central">客户端</text>
<text class="ts" x="100" y="208" text-anchor="middle" dominant-baseline="central">你的应用</text>
<line x1="160" y1="98" x2="208" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="198" x2="208" y2="176" class="arr" marker-end="url(#arrow)"/>
<rect x="210" y="40" width="260" height="220" rx="12" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">一个线程</text>
<g class="c-purple"><rect x="225" y="90" width="100" height="120" rx="8" stroke-width="0.5"/><text class="th" x="275" y="138" text-anchor="middle" dominant-baseline="central">协程们</text><text class="ts" x="275" y="160" text-anchor="middle" dominant-baseline="central">每连接一个</text></g>
<line x1="325" y1="150" x2="353" y2="150" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="355" y="90" width="100" height="120" rx="8" stroke-width="0.5"/><text class="th" x="405" y="138" text-anchor="middle" dominant-baseline="central">连接池</text><text class="ts" x="405" y="160" text-anchor="middle" dominant-baseline="central">本线程独享</text></g>
<line x1="455" y1="120" x2="508" y2="98" class="arr" marker-end="url(#arrow)"/>
<line x1="455" y1="180" x2="508" y2="198" class="arr" marker-end="url(#arrow)"/>
<rect x="510" y="70" width="130" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="575" y="88" text-anchor="middle" dominant-baseline="central">OpenAI</text>
<text class="ts" x="575" y="108" text-anchor="middle" dominant-baseline="central">上游</text>
<rect x="510" y="170" width="130" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="575" y="188" text-anchor="middle" dominant-baseline="central">llama.cpp</text>
<text class="ts" x="575" y="208" text-anchor="middle" dominant-baseline="central">上游</text>
<text class="ts" x="100" y="250" text-anchor="middle">入站连接</text>
<text class="ts" x="575" y="250" text-anchor="middle">出站连接</text>
<text class="ts" x="100" y="268" text-anchor="middle">客户端发起，不用池</text>
<text class="ts" x="575" y="268" text-anchor="middle">网关发起，用池复用</text>
</svg>
