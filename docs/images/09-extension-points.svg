<svg xmlns="http://www.w3.org/2000/svg" width="680" height="454" viewBox="0 0 680 454" role="img"><title>可扩展与可插拔：核心加扩展点</title><desc>顶部是稳定的核心，即请求管线骨架。中间是六个扩展点：中间件、路由策略、请求改写、协议适配、状态存储、观测输出，接口固定，实现可插拔。下方是注册表和工厂，按配置中的名字创建实例，每个 Worker 一份。最底部是配置，决定启用哪些插件、顺序和参数。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="454" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="40" y="20" width="600" height="70" rx="10" stroke-width="0.5"/><text class="th" x="340" y="44" text-anchor="middle" dominant-baseline="central">核心：请求管线骨架（稳定，很少修改）</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">接入 → 策略 → 路由 → 执行 → 上游 → 转发</text></g>
<text class="ts" x="40" y="114" dominant-baseline="central">扩展点：接口固定，实现可插拔</text>
<line x1="340" y1="90" x2="340" y2="130" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="132" width="186" height="64" rx="8" stroke-width="0.5"/><text class="th" x="133" y="154" text-anchor="middle" dominant-baseline="central">中间件</text><text class="ts" x="133" y="176" text-anchor="middle" dominant-baseline="central">鉴权 限流 预算 缓存</text></g>
<g class="c-teal"><rect x="247" y="132" width="186" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="154" text-anchor="middle" dominant-baseline="central">路由策略</text><text class="ts" x="340" y="176" text-anchor="middle" dominant-baseline="central">顺序切换 加权 按成本</text></g>
<g class="c-teal"><rect x="454" y="132" width="186" height="64" rx="8" stroke-width="0.5"/><text class="th" x="547" y="154" text-anchor="middle" dominant-baseline="central">请求改写</text><text class="ts" x="547" y="176" text-anchor="middle" dominant-baseline="central">删字段 改名 强制设置</text></g>
<g class="c-teal"><rect x="40" y="212" width="186" height="64" rx="8" stroke-width="0.5"/><text class="th" x="133" y="234" text-anchor="middle" dominant-baseline="central">协议适配</text><text class="ts" x="133" y="256" text-anchor="middle" dominant-baseline="central">OpenAI 兼容 / Anthropic</text></g>
<g class="c-teal"><rect x="247" y="212" width="186" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="234" text-anchor="middle" dominant-baseline="central">状态存储</text><text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">内存 / Redis</text></g>
<g class="c-teal"><rect x="454" y="212" width="186" height="64" rx="8" stroke-width="0.5"/><text class="th" x="547" y="234" text-anchor="middle" dominant-baseline="central">观测输出</text><text class="ts" x="547" y="256" text-anchor="middle" dominant-baseline="central">Prometheus / OTel</text></g>
<line x1="340" y1="276" x2="340" y2="298" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="300" width="600" height="64" rx="10" stroke-width="0.5"/><text class="th" x="340" y="322" text-anchor="middle" dominant-baseline="central">注册表 + 工厂</text><text class="ts" x="340" y="344" text-anchor="middle" dominant-baseline="central">按配置里的名字创建实例，每个 Worker 一份</text></g>
<rect x="220" y="392" width="240" height="44" rx="8" class="box" stroke-width="0.5"/>
<text class="t" x="340" y="414" text-anchor="middle" dominant-baseline="central">配置：启用哪些、顺序、参数</text>
<line x1="340" y1="392" x2="340" y2="366" class="arr" marker-end="url(#arrow)"/>
</svg>
