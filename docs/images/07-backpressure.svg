<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"><title>背压：现在与方案对比</title><desc>上一行是现在的做法：上游很快，转发队列无上限，客户端很慢，内存一直增长。下一行是方案：队列有上限，满了就暂停读取上游，TCP 会让上游自动放慢。用协程时读一块写一块，背压自然实现。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="30">原型：队列没有上限</text>
<g class="c-gray"><rect x="40" y="50" width="150" height="60" rx="8" stroke-width="0.5"/><text class="th" x="115" y="70" text-anchor="middle" dominant-baseline="central">上游</text><text class="ts" x="115" y="92" text-anchor="middle" dominant-baseline="central">吐数据很快</text></g>
<line x1="190" y1="80" x2="263" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="265" y="50" width="150" height="60" rx="8" stroke-width="0.5"/><text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">转发队列</text><text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">越积越多，内存爆</text></g>
<line x1="415" y1="80" x2="488" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="490" y="50" width="150" height="60" rx="8" stroke-width="0.5"/><text class="th" x="565" y="70" text-anchor="middle" dominant-baseline="central">客户端</text><text class="ts" x="565" y="92" text-anchor="middle" dominant-baseline="central">网速慢，读得慢</text></g>
<text class="th" x="40" y="165">新设计：读一块，写完再读下一块</text>
<g class="c-gray"><rect x="40" y="185" width="150" height="60" rx="8" stroke-width="0.5"/><text class="th" x="115" y="205" text-anchor="middle" dominant-baseline="central">上游</text><text class="ts" x="115" y="227" text-anchor="middle" dominant-baseline="central">TCP 让它自动放慢</text></g>
<line x1="190" y1="215" x2="263" y2="215" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="265" y="185" width="150" height="60" rx="8" stroke-width="0.5"/><text class="th" x="340" y="205" text-anchor="middle" dominant-baseline="central">协程</text><text class="ts" x="340" y="227" text-anchor="middle" dominant-baseline="central">手里只有一块</text></g>
<line x1="415" y1="215" x2="488" y2="215" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="490" y="185" width="150" height="60" rx="8" stroke-width="0.5"/><text class="th" x="565" y="205" text-anchor="middle" dominant-baseline="central">客户端</text><text class="ts" x="565" y="227" text-anchor="middle" dominant-baseline="central">读走了，再继续</text></g>
<path d="M340 245 L340 285 L115 285 L115 249" fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="227" y="306" text-anchor="middle">还没写完：暂停读上游</text>
</svg>
