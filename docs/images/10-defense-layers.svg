<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img"><title>稳定性：五层纵深防护</title><desc>请求从上往下依次经过五层防护。入口层挡住异常流量：连接数上限、请求大小上限、读取超时、鉴权。流量层控制进来多少：限流、预算、过载保护。调用层处理上游问题：四种超时、重试规则和重试预算、熔断、舱壁隔离。资源层保证资源有界：背压、内存水位、连接池上限、文件描述符上限。进程层处理网关自身问题：异常隔离、事件循环看门狗、崩溃自动重启、优雅退出。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="60" y="20" text-anchor="middle" dominant-baseline="central">请求</text>
<line x1="60" y1="32" x2="60" y2="354" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="90" y="30" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="160" y="48" text-anchor="middle" dominant-baseline="central">入口层</text><text class="ts" x="160" y="68" text-anchor="middle" dominant-baseline="central">挡住异常流量</text></g>
<rect x="245" y="30" width="395" height="56" rx="8" class="box" stroke-width="0.5"/><text class="t" x="442" y="58" text-anchor="middle" dominant-baseline="central">连接数上限 · 请求大小上限 · 读取超时 · 鉴权</text>
<g class="c-teal"><rect x="90" y="98" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="160" y="116" text-anchor="middle" dominant-baseline="central">流量层</text><text class="ts" x="160" y="136" text-anchor="middle" dominant-baseline="central">控制进来多少</text></g>
<rect x="245" y="98" width="395" height="56" rx="8" class="box" stroke-width="0.5"/><text class="t" x="442" y="126" text-anchor="middle" dominant-baseline="central">限流 · 预算 · 过载保护（排队超时返回 503）</text>
<g class="c-teal"><rect x="90" y="166" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="160" y="184" text-anchor="middle" dominant-baseline="central">调用层</text><text class="ts" x="160" y="204" text-anchor="middle" dominant-baseline="central">上游出问题时</text></g>
<rect x="245" y="166" width="395" height="56" rx="8" class="box" stroke-width="0.5"/><text class="t" x="442" y="194" text-anchor="middle" dominant-baseline="central">四种超时 · 重试规则 + 重试预算 · 熔断 · 舱壁隔离</text>
<g class="c-teal"><rect x="90" y="234" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="160" y="252" text-anchor="middle" dominant-baseline="central">资源层</text><text class="ts" x="160" y="272" text-anchor="middle" dominant-baseline="central">资源始终有界</text></g>
<rect x="245" y="234" width="395" height="56" rx="8" class="box" stroke-width="0.5"/><text class="t" x="442" y="262" text-anchor="middle" dominant-baseline="central">背压 · 内存水位 · 连接池上限 · 文件描述符上限</text>
<g class="c-teal"><rect x="90" y="302" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="160" y="320" text-anchor="middle" dominant-baseline="central">进程层</text><text class="ts" x="160" y="340" text-anchor="middle" dominant-baseline="central">网关自身出问题时</text></g>
<rect x="245" y="302" width="395" height="56" rx="8" class="box" stroke-width="0.5"/><text class="t" x="442" y="330" text-anchor="middle" dominant-baseline="central">异常隔离 · 事件循环看门狗 · 崩溃自动重启 · 优雅退出</text>
<text class="ts" x="365" y="382" text-anchor="middle" dominant-baseline="central">每一层都假设上一层可能失守</text>
</svg>
