<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img"><title>产品定位：三大支柱</title><desc>顶部是产品定位：一个不会让你多花钱、也不会掉线的大模型网关。下面是三大支柱。不多花钱：不重复扣费、预算绝不超支、每笔费用可追溯。不掉线：自动切换与熔断、配额快用完时提前分流、首字延迟可观测。不折腾：单个二进制零依赖、兼容 OpenAI 接口、五分钟完成部署。底部是产品原则：可靠性优先于功能数量。</desc><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif}.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#1f1e1d}.box{fill:#faf9f5;stroke:#b4b2a9}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}</style><rect width="680" height="400" fill="#ffffff"/>
<g class="c-purple"><rect x="40" y="20" width="600" height="64" rx="10" stroke-width="0.5"/><text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">llmgw：一个不会让你多花钱、也不会掉线的大模型网关</text><text class="ts" x="340" y="64" text-anchor="middle" dominant-baseline="central">开源 · 自部署 · 单个二进制</text></g>
<g class="c-teal"><rect x="40" y="108" width="186" height="56" rx="8" stroke-width="0.5"/><text class="th" x="133" y="126" text-anchor="middle" dominant-baseline="central">不多花钱</text><text class="ts" x="133" y="146" text-anchor="middle" dominant-baseline="central">成本可控、可追溯</text></g>
<g class="c-teal"><rect x="247" y="108" width="186" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="126" text-anchor="middle" dominant-baseline="central">不掉线</text><text class="ts" x="340" y="146" text-anchor="middle" dominant-baseline="central">一家出事，自动换家</text></g>
<g class="c-teal"><rect x="454" y="108" width="186" height="56" rx="8" stroke-width="0.5"/><text class="th" x="547" y="126" text-anchor="middle" dominant-baseline="central">不折腾</text><text class="ts" x="547" y="146" text-anchor="middle" dominant-baseline="central">下载就能跑</text></g>
<rect x="40" y="176" width="186" height="40" rx="6" class="box" stroke-width="0.5"/><text class="t" x="133" y="196" text-anchor="middle" dominant-baseline="central">不重复扣费</text>
<rect x="40" y="224" width="186" height="40" rx="6" class="box" stroke-width="0.5"/><text class="t" x="133" y="244" text-anchor="middle" dominant-baseline="central">预算绝不超支</text>
<rect x="40" y="272" width="186" height="40" rx="6" class="box" stroke-width="0.5"/><text class="t" x="133" y="292" text-anchor="middle" dominant-baseline="central">每笔费用可追溯</text>
<rect x="247" y="176" width="186" height="40" rx="6" class="box" stroke-width="0.5"/><text class="t" x="340" y="196" text-anchor="middle" dominant-baseline="central">自动切换与熔断</text>
<rect x="247" y="224" width="186" height="40" rx="6" class="box" stroke-width="0.5"/><text class="t" x="340" y="244" text-anchor="middle" dominant-baseline="central">配额将尽，提前分流</text>
<rect x="247" y="272" width="186" height="40" rx="6" class="box" stroke-width="0.5"/><text class="t" x="340" y="292" text-anchor="middle" dominant-baseline="central">首字延迟看得见</text>
<rect x="454" y="176" width="186" height="40" rx="6" class="box" stroke-width="0.5"/><text class="t" x="547" y="196" text-anchor="middle" dominant-baseline="central">单二进制，零依赖</text>
<rect x="454" y="224" width="186" height="40" rx="6" class="box" stroke-width="0.5"/><text class="t" x="547" y="244" text-anchor="middle" dominant-baseline="central">兼容 OpenAI 接口</text>
<rect x="454" y="272" width="186" height="40" rx="6" class="box" stroke-width="0.5"/><text class="t" x="547" y="292" text-anchor="middle" dominant-baseline="central">5 分钟完成部署</text>
<g class="c-gray"><rect x="40" y="336" width="600" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="358" text-anchor="middle" dominant-baseline="central">产品原则：可靠性优先于功能数量</text></g>
</svg>
